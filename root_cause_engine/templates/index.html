<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Root Cause Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --surface:   rgba(255,255,255,0.026);
      --border:    rgba(255,255,255,0.07);
      --border-hv: rgba(255,255,255,0.13);
      --red:       #e11d48;
      --red-dim:   rgba(225,29,72,0.12);
      --red-bdr:   rgba(225,29,72,0.28);
      --text:      #ffffff;
      --text-muted:rgba(255,255,255,0.38);
      --text-dim:  rgba(255,255,255,0.55);
      --mono:      'Space Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    /* ── Layout ── */
    .shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.5s 0s cubic-bezier(.22,1,.36,1) forwards;
    }
    .dot-live {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      animation: pulse-ring 2.5s ease-out infinite;
    }
    .page-title {
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── Waiting state ── */
    #waiting-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 20px;
      gap: 14px;
      opacity: 0;
      animation: fadeUp 0.5s 0.1s cubic-bezier(.22,1,.36,1) forwards;
    }
    .waiting-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .waiting-text {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-align: center;
      line-height: 1.7;
    }
    .waiting-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      text-align: center;
    }

    /* ── RCA Panel ── */
    #rca-panel { display: none; }
    #rca-panel.visible { display: block; }

    /* ── Section label ── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-label-bar {
      width: 3px; height: 13px;
      background: linear-gradient(180deg, var(--red), #fb7185);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .section-label span {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border-hv); }

    /* ── Header card ── */
    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0;
    }
    .defect-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      flex: 1;
    }
    .severity-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      border-radius: 6px;
      padding: 3px 9px;
      flex-shrink: 0;
    }

    /* ── Warning ── */
    .warning-bar {
      background: rgba(250,204,21,0.07);
      border: 1px solid rgba(250,204,21,0.22);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .warning-bar span {
      font-family: var(--mono);
      font-size: 11px;
      color: #facc15;
      letter-spacing: 0.02em;
    }

    /* ── Primary cause ── */
    .primary-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .cause-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--red-dim);
      border: 1px solid var(--red-bdr);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .cause-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    /* ── Confidence bar ── */
    .conf-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .conf-track {
      flex: 1;
      height: 5px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      overflow: hidden;
    }
    .conf-fill {
      height: 100%;
      border-radius: 99px;
      width: 0;
      transition: width 0.9s cubic-bezier(.22,1,.36,1);
    }
    .conf-val {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      min-width: 44px;
      text-align: right;
      letter-spacing: 0.02em;
    }

    /* ── Reason chip ── */
    .reason-chip {
      background: rgba(255,255,255,0.035);
      border-radius: 9px;
      padding: 10px 13px;
      display: flex;
      gap: 9px;
    }
    .reason-chip p {
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(255,255,255,0.48);
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    /* ── Secondary causes ── */
    .sec-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.022);
      border: 1px solid rgba(255,255,255,0.055);
      border-radius: 10px;
      margin-bottom: 7px;
      transition: background 0.18s;
    }
    .sec-row:last-child { margin-bottom: 0; }
    .sec-row:hover { background: rgba(255,255,255,0.042); }
    .sec-num {
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      min-width: 20px;
      font-weight: 700;
    }
    .sec-cause {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      flex: 1;
      letter-spacing: -0.005em;
    }

    /* ── Actions ── */
    .action-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 7px;
      transition: background 0.18s, border-color 0.18s;
      color: inherit;
      font-family: var(--sans);
    }
    .action-btn:last-child { margin-bottom: 0; }
    .action-btn:hover {
      background: rgba(225,29,72,0.07);
      border-color: rgba(225,29,72,0.22);
    }
    .action-btn.open {
      background: rgba(225,29,72,0.06);
      border-color: rgba(225,29,72,0.28);
    }
    .action-icon-wrap {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.2s;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .action-btn.open .action-icon-wrap {
      background: rgba(225,29,72,0.16);
      border-color: rgba(225,29,72,0.35);
    }
    .action-text { flex: 1; }
    .action-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      letter-spacing: -0.005em;
      transition: color 0.18s;
    }
    .action-btn.open .action-label { color: #fff; }
    .action-sub {
      display: none;
      font-family: var(--mono);
      font-size: 10px;
      color: rgba(255,255,255,0.32);
      margin-top: 5px;
      letter-spacing: 0.02em;
      line-height: 1.6;
    }
    .action-btn.open .action-sub { display: block; }
    .action-arrow {
      font-size: 14px;
      color: rgba(255,255,255,0.18);
      flex-shrink: 0;
      transition: transform 0.22s, color 0.18s;
      line-height: 1;
      margin-top: 1px;
    }
    .action-btn.open .action-arrow {
      transform: rotate(90deg);
      color: var(--red);
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .a0 { opacity:0; animation: fadeUp 0.5s 0.00s cubic-bezier(.22,1,.36,1) forwards; }
    .a1 { opacity:0; animation: fadeUp 0.5s 0.08s cubic-bezier(.22,1,.36,1) forwards; }
    .a2 { opacity:0; animation: fadeUp 0.5s 0.16s cubic-bezier(.22,1,.36,1) forwards; }
    .a3 { opacity:0; animation: fadeUp 0.5s 0.24s cubic-bezier(.22,1,.36,1) forwards; }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(225,29,72,0.40); }
      70%  { box-shadow: 0 0 0 8px rgba(225,29,72,0); }
      100% { box-shadow: 0 0 0 0 rgba(225,29,72,0); }
    }

    /* ── Loading skeleton ── */
    #loading-state { display: none; padding: 40px 0; text-align: center; }
    .loader-text {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .loader-text { animation: blink 1.2s ease-in-out infinite; }
  </style>
</head>
<body>

<div class="shell">

  <!-- Page header -->
  <div class="page-header">
    <div class="dot-live"></div>
    <span class="page-title">Root Cause &amp; Action Engine</span>
  </div>

  <!-- Waiting for upstream data -->
  <div id="waiting-state">
    <div class="waiting-icon">🔬</div>
    <p class="waiting-text">Awaiting signal from<br>Defect Intelligence Module</p>
    <p class="waiting-sub">Analysis will render automatically</p>
  </div>

  <!-- Loading indicator -->
  <div id="loading-state">
    <p class="loader-text">Analyzing defect pattern…</p>
  </div>

  <!-- RCA Output Panel -->
  <div id="rca-panel">

    <!-- Header: defect + severity -->
    <div class="card a0" id="rca-header">
      <div class="header-row">
        <span class="defect-name" id="rca-defect-name">—</span>
        <span class="severity-badge" id="rca-severity-badge">—</span>
      </div>
    </div>

    <!-- Warning (shown only on low confidence) -->
    <div class="warning-bar a0" id="rca-warning" style="display:none;">
      <span style="font-size:14px;">⚠️</span>
      <span id="rca-warning-text"></span>
    </div>

    <!-- Primary cause -->
    <div class="card a1" id="rca-primary-card">
      <div class="section-label">
        <div class="section-label-bar"></div>
        <span>Primary Root Cause</span>
      </div>
      <div class="primary-row">
        <div class="cause-icon">🎯</div>
        <div style="flex:1;">
          <div class="cause-name" id="rca-primary-cause">—</div>
          <div class="conf-wrap">
            <div class="conf-track">
              <div class="conf-fill" id="rca-primary-bar" style="background:linear-gradient(90deg,#e11d4888,#e11d48);box-shadow:0 0 8px #e11d4855;"></div>
            </div>
            <span class="conf-val" id="rca-primary-val" style="color:#e11d48;">—</span>
          </div>
        </div>
      </div>
      <div class="reason-chip">
        <span style="font-size:13px;flex-shrink:0;margin-top:1px;">💡</span>
        <p id="rca-reason">—</p>
      </div>
    </div>

    <!-- Secondary causes -->
    <div class="card a2" id="rca-secondary-card">
      <div class="section-label">
        <div class="section-label-bar"></div>
        <span>Alternative Causes</span>
      </div>
      <div id="rca-secondary-list"></div>
    </div>

    <!-- Actions -->
    <div class="card a3" id="rca-actions-card">
      <div class="section-label">
        <div class="section-label-bar"></div>
        <span>Recommended Actions</span>
      </div>
      <div id="rca-actions-list"></div>
    </div>

  </div><!-- /#rca-panel -->
</div><!-- /.shell -->

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const ACTION_ICONS = ["⚙️","🔧","🔍","📋","🧪","🛠️"];

  const SEVERITY_CONFIG = {
    Low:      { color:"#4ade80", bg:"rgba(74,222,128,0.10)",  label:"LOW"  },
    Medium:   { color:"#facc15", bg:"rgba(250,204,21,0.10)",  label:"MED"  },
    High:     { color:"#f97316", bg:"rgba(249,115,22,0.10)",  label:"HIGH" },
    Critical: { color:"#ef4444", bg:"rgba(239,68,68,0.12)",   label:"CRIT" },
  };

  // ── Confidence bar animator ───────────────────────────────────────────────
  function animateBar(barEl, valEl, value, color) {
    valEl.textContent = value.toFixed(1) + "%";
    valEl.style.color = color;
    barEl.style.background = `linear-gradient(90deg,${color}88,${color})`;
    barEl.style.boxShadow = `0 0 8px ${color}55`;
    // Delay so CSS transition fires after element is visible
    requestAnimationFrame(() => {
      setTimeout(() => { barEl.style.width = value + "%"; }, 80);
    });
  }

  // ── Render RCA data ───────────────────────────────────────────────────────
  function renderRCA(data) {
    // Hide waiting / loading
    document.getElementById("waiting-state").style.display = "none";
    document.getElementById("loading-state").style.display  = "none";

    const panel = document.getElementById("rca-panel");

    // Reset animation classes so they replay
    panel.querySelectorAll(".a0,.a1,.a2,.a3").forEach(el => {
      const cls = [...el.classList].find(c => /^a\d$/.test(c));
      el.classList.remove(cls);
      void el.offsetWidth; // reflow
      el.classList.add(cls);
    });

    // Severity
    const sev = SEVERITY_CONFIG[data.severity] || SEVERITY_CONFIG.Medium;
    const badge = document.getElementById("rca-severity-badge");
    badge.textContent = sev.label;
    badge.style.color      = sev.color;
    badge.style.background = sev.bg;
    badge.style.border     = `1px solid ${sev.color}44`;

    // Defect name
    document.getElementById("rca-defect-name").textContent = data.defect;

    // Warning
    const warnBar  = document.getElementById("rca-warning");
    const warnText = document.getElementById("rca-warning-text");
    if (data.warning) {
      warnText.textContent = data.warning;
      warnBar.style.display = "flex";
    } else {
      warnBar.style.display = "none";
    }

    // Primary cause
    document.getElementById("rca-primary-cause").textContent = data.primary.cause;
    document.getElementById("rca-reason").textContent        = data.reason;
    animateBar(
      document.getElementById("rca-primary-bar"),
      document.getElementById("rca-primary-val"),
      data.primary.confidence,
      "#e11d48"
    );

    // Secondary causes
    const secList = document.getElementById("rca-secondary-list");
    secList.innerHTML = "";
    data.secondary.forEach((s, i) => {
      const trackId = "sec-bar-" + i;
      const valId   = "sec-val-" + i;
      const row = document.createElement("div");
      row.className = "sec-row";
      row.innerHTML = `
        <span class="sec-num">${String(i + 2).padStart(2,"0")}</span>
        <span class="sec-cause">${s.cause}</span>
        <div class="conf-wrap">
          <div class="conf-track">
            <div class="conf-fill" id="${trackId}"></div>
          </div>
          <span class="conf-val" id="${valId}">—</span>
        </div>
      `;
      secList.appendChild(row);
      animateBar(document.getElementById(trackId), document.getElementById(valId), s.confidence, "#64748b");
    });

    // Actions
    const actList = document.getElementById("rca-actions-list");
    actList.innerHTML = "";
    data.actions.forEach((action, i) => {
      const btn = document.createElement("button");
      btn.className = "action-btn";
      btn.innerHTML = `
        <div class="action-icon-wrap">${ACTION_ICONS[i] || "📌"}</div>
        <div class="action-text">
          <div class="action-label">${action}</div>
          <div class="action-sub">Step ${i+1} of ${data.actions.length} · Tap to mark complete</div>
        </div>
        <span class="action-arrow">›</span>
      `;
      btn.addEventListener("click", () => btn.classList.toggle("open"));
      actList.appendChild(btn);
    });

    // Show panel
    panel.classList.add("visible");
  }

  // ── Public API: called by Defect Intelligence Module ─────────────────────
  //
  //   window.runRCA({ predicted_defect: "DONUT", confidence: 0.82 })
  //
  window.runRCA = function(input) {
    document.getElementById("waiting-state").style.display = "none";
    document.getElementById("loading-state").style.display = "block";
    document.getElementById("rca-panel").classList.remove("visible");

    fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(input)
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        document.getElementById("loading-state").style.display = "none";
        document.getElementById("waiting-state").style.display = "flex";
        console.error("RCA error:", data.error);
        return;
      }
      renderRCA(data);
    })
    .catch(err => {
      console.error("Fetch failed:", err);
      document.getElementById("loading-state").style.display = "none";
    });
  };

  // ── Listen for postMessage from Defect Intelligence Module ────────────────
  //   (if both modules are on the same page via iframes or dispatched events)
  window.addEventListener("message", function(event) {
    if (event.data && event.data.type === "DEFECT_PREDICTION") {
      window.runRCA({
        predicted_defect: event.data.predicted_defect,
        confidence:       event.data.confidence
      });
    }
  });

  // ── Also listen for a custom DOM event (same-page communication) ──────────
  //   document.dispatchEvent(new CustomEvent("defect:prediction", {
  //     detail: { predicted_defect: "EDGE_RING", confidence: 0.91 }
  //   }))
  document.addEventListener("defect:prediction", function(event) {
    window.runRCA(event.detail);
  });
</script>

</body>
</html>
